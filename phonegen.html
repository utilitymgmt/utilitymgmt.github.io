<!DOCTYPE html>
<html>
<head>
    <title>Phone Scenario Generator</title>
</head>
<body>

<h2>Random Scenario Generator</h2>
<button onclick="generateScenario()">Generate Scenario</button>

<pre id="output"></pre>

<script>
// Internet options
const internetOptions = [
    "No Internet",
    "Needs Internet – Congested Area",
    "Needs Internet – Non-Congested Area"
];

// iPhone groups
const iphoneOld = ["iPhone 7", "iPhone 8", "iPhone X", "iPhone 11", "iPhone 12"];
const iphoneBase = ["iPhone 11", "iPhone 12", "iPhone 13", "iPhone 14", "iPhone 15", "iPhone 16", "iPhone 17"];
const iphonePro = ["iPhone 11 Pro", "iPhone 12 Pro", "iPhone 13 Pro", "iPhone 14 Pro", "iPhone 15 Pro", "iPhone 16 Pro", "iPhone 17 Pro"];
const iphoneProMax = ["iPhone 11 Pro Max", "iPhone 12 Pro Max", "iPhone 13 Pro Max", "iPhone 14 Pro Max", "iPhone 15 Pro Max", "iPhone 16 Pro Max", "iPhone 17 Pro Max"];

// Samsung groups
const samsungOld = [
    "Samsung Galaxy S9","Samsung Galaxy S10","Samsung Galaxy S20","Samsung Galaxy S21",
    "Samsung Galaxy S9+","Samsung Galaxy S10+","Samsung Galaxy S20+","Samsung Galaxy S21+"
];

const samsungNormal = ["Samsung Galaxy S22","Samsung Galaxy S23","Samsung Galaxy S24","Samsung Galaxy S25","Samsung Galaxy S26"];
const samsungPlus = ["Samsung Galaxy S22+","Samsung Galaxy S23+","Samsung Galaxy S24+","Samsung Galaxy S25+","Samsung Galaxy S26+"];

const samsungUltraNote = [
    "Samsung Galaxy Note 9","Samsung Galaxy Note 10","Samsung Galaxy Note 10+","Samsung Galaxy Note 20",
    "Samsung Galaxy Note 20 Ultra","Samsung Galaxy S21 Ultra","Samsung Galaxy S22 Ultra",
    "Samsung Galaxy S23 Ultra","Samsung Galaxy S24 Ultra","Samsung Galaxy S25 Ultra","Samsung Galaxy S26 Ultra",
    "Samsung Galaxy Z Fold 3","Samsung Galaxy Z Fold 4","Samsung Galaxy Z Fold 5","Samsung Galaxy Z Fold 6","Samsung Galaxy Z Fold 7"
];

// Google
const pixel5 = ["Google Pixel 5"];
const pixel67 = ["Google Pixel 6","Google Pixel 7","Google Pixel 6 Pro","Google Pixel 7 Pro"];

// Helper: weighted random choice
function weightedChoice(options, weights) {
    let total = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;
    let sum = 0;

    for (let i = 0; i < options.length; i++) {
        sum += weights[i];
        if (rand < sum) return options[i];
    }
}

// Helper: random item
function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// NEW: weighted line count (30% / 60% / 10%)
function chooseLineCount() {
    let rand = Math.random();

    if (rand < 0.30) {
        return 1;
    } else if (rand < 0.90) { // 30% + 60%
        return Math.floor(Math.random() * 4) + 2; // 2–5
    } else {
        return Math.floor(Math.random() * 2) + 6; // 6–7
    }
}

function choosePhone() {
    let brand = weightedChoice(["iPhone","Samsung","Google"], [67,32,3]);

    if (brand === "iPhone") {
        if (Math.random() < 0.25) {
            return randomItem(iphoneOld);
        } else {
            let type = weightedChoice(["base","pro","pro_max"], [50,20,30]);
            if (type === "base") return randomItem(iphoneBase);
            if (type === "pro") return randomItem(iphonePro);
            return randomItem(iphoneProMax);
        }
    }

    if (brand === "Samsung") {
        if (Math.random() < 0.25) {
            return randomItem(samsungOld);
        } else {
            let type = weightedChoice(["ultra_note","normal","plus"], [55,30,15]);
            if (type === "ultra_note") return randomItem(samsungUltraNote);
            if (type === "normal") return randomItem(samsungNormal);
            return randomItem(samsungPlus);
        }
    }

    if (brand === "Google") {
        if (Math.random() < 0.25) {
            return randomItem(pixel5);
        } else {
            return randomItem(pixel67);
        }
    }
}

function generateScenario() {
    let internet = randomItem(internetOptions);
    let numPhones = chooseLineCount();

    let phones = [];
    for (let i = 0; i < numPhones; i++) {
        phones.push(choosePhone());
    }

    document.getElementById("output").textContent =
        "Internet: " + internet + "\n\nLines: " + numPhones +
        "\n\nPhones:\n- " + phones.join("\n- ");
}
</script>

</body>
</html>
